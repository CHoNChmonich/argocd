# Локальный dev-стенд БЕЗ k8s: проверить, что сервисы, БД, очередь, кэш и телеметрия работают вместе.
# В кластере все зависимости (Postgres, Redis, RabbitMQ, Prometheus, Jaeger) ставятся через Helm.

x-service: &service
  restart: unless-stopped
  environment: &service-env
    DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
    REDIS_URL: redis://redis:6379/0
    RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    INVENTORY_URL: http://inventory:8000
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    LOG_LEVEL: INFO
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }

services:
  orders:
    <<: *service
    image: shop/orders:dev
    build: { context: ./services, target: orders }
    ports: ["8081:8000"]

  inventory:
    <<: *service
    image: shop/inventory:dev
    build: { context: ./services, target: inventory }
    ports: ["8082:8000"]

  notifier:
    <<: *service
    image: shop/notifier:dev
    build: { context: ./services, target: notifier }
    ports: ["8083:8000"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    # порт наружу не публикуем: на хосте 5432 часто занят локальным Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"   # UI: guest/guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./deploy/local/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
