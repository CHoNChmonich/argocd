apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h                       # как часто перечитывать Vault (ротация без коммита)
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target:
    name: grafana-admin                            # имя Secret, которое ждёт чарт (existingSecret)
    creationPolicy: Owner
  dataFrom:
    - extract: { key: monitoring/grafana-admin }             # все ключи из secret/data/monitoring/grafana-admin -> ключи Secret как есть
