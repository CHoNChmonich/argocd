apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-secret
  namespace: argocd
spec:
  refreshInterval: 1h                       # как часто перечитывать Vault (ротация без коммита)
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target:
    name: argocd-secret                            # имя Secret, которое ждёт чарт (existingSecret)
    creationPolicy: Owner
  dataFrom:
    - extract: { key: argocd/argocd-secret }             # все ключи из secret/data/argocd/argocd-secret -> ключи Secret как есть
