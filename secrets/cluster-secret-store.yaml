# Как ESO ходит в Vault: адрес, KV v2 на пути secret/, аутентификация Kubernetes auth — ESO предъявляет токен
# своего ServiceAccount, Vault проверяет его через TokenReview и выдаёт токен роли eso (политика eso-read:
# только чтение secret/data/*). Никаких статических кредов Vault в кластере нет.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
