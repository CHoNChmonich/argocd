# argo/argo-cd 10.4.0 (Argo CD v3.5). Полный список: helm show values argo/argo-cd --version 10.4.0
# Ставится дважды одними и теми же values: cluster/bootstrap.sh (первый раз) и gitops/platform/00-argo-cd.yaml (дальше).
#
# Компоненты: application-controller (diff/sync), repo-server (clone + helm template), server (API+UI),
# redis (кэш), applicationset-controller. Dex (SSO) и notifications для лабы выключены.

fullnameOverride: argocd

configs:
  cm:
    # Как Argo помечает "свои" объекты. По умолчанию — label app.kubernetes.io/instance=<Application>,
    # но эту метку используют bitnami-чарты в селекторах (instance=<release>) — конфликт. Аннотация безопасна.
    application.resourceTrackingMethod: annotation
    # Поллинг git — резерв; основной сигнал — webhook GitHub -> POST /api/webhook (подпись HMAC ключом
    # webhook.github.secret из argocd-secret). Локально GitHub до кластера не достаёт, поэтому поллинг чаще default 3m.
    timeout.reconciliation: 60s
    # бейдж статуса Application без логина (/api/badge?name=shop) — первое изменение, применённое Argo к самому себе
    statusbadge.enabled: "true"
  params:
    # TLS терминируется в ingress-nginx; сам server отдаёт HTTP (иначе redirect-петля за прокси)
    server.insecure: true

  # argocd-secret (admin.password bcrypt, server.secretkey для JWT, webhook.github.secret, позже dex.github.clientSecret)
  # чарт НЕ создаёт — его даёт Sealed Secrets из secrets/argocd/argocd-secret.yaml. Argo дописывает туда ключи
  # только если их нет, поэтому пароль admin задаётся из git, а не генерируется при старте.
  secret:
    createSecret: false

  # RBAC самого Argo (argocd-rbac-cm, Casbin). Контроллер — cluster-admin, и это норма для in-cluster Argo:
  # его права не могут быть уже суммы того, что через него деплоят (CRD, ClusterRole, любые namespace).
  # Ограничивают не контроллер, а людей и токены: AppProject задаёт границы, эти роли — кто что может внутри них.
  # Пока без SSO (dex выключен) роли привязать не к кому — admin остаётся; при включении SSO:
  # g, <группа-из-провайдера>, role:platform-admin и configs.params admin.enabled: false.
  rbac:
    policy.default: role:readonly         # вошёл без роли — только смотреть
    policy.csv: |
      # платформенная команда: всё, включая проекты, репозитории, кластеры; exec в поды — только им
      p, role:platform-admin, *, *, *, allow
      # команда shop: видеть, синхронизировать, откатывать и читать логи только в проекте shop;
      # не может менять Application (spec, проект), создавать/удалять их, трогать проекты и репозитории, exec
      p, role:shop-dev, applications, get,      shop/*, allow
      p, role:shop-dev, applications, sync,     shop/*, allow
      p, role:shop-dev, applications, action/*, shop/*, allow
      p, role:shop-dev, logs,         get,      shop/*, allow
      p, role:shop-dev, projects,     get,      shop,   allow

server:
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.shop.localtest.me
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

controller:
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 1Gi }

repoServer:
  # /healthz?full=true у repo-server на медленном диске/WSL2 не укладывается в default timeout 1s ->
  # liveness убивал под в CrashLoopBackOff. Даём пробам запас.
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 5
    periodSeconds: 15
  readinessProbe:
    timeoutSeconds: 10
    failureThreshold: 5
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

redis:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 128Mi }

applicationSet:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }

dex:
  enabled: false
notifications:
  enabled: false
