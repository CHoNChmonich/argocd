# external-secrets/external-secrets 2.10.0. Полный список: helm show values external-secrets/external-secrets
#
# Контроллер + webhook (валидация CRD) + cert-controller (сертификат webhook'а). Сам секретов не хранит:
# читает из Vault (secrets/cluster-secret-store.yaml) и создаёт Secret'ы по ExternalSecret'ам (secrets/<ns>/).
installCRDs: true
serviceAccount:
  name: external-secrets       # это имя привязано к роли eso в Vault (bound_service_account_names)

resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { memory: 256Mi }
webhook:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
certController:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

serviceMonitor:
  enabled: true
