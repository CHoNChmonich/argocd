# sealed-secrets/sealed-secrets 2.19.3 (controller 0.39.1). Полный список: helm show values sealed-secrets/sealed-secrets
#
# Контроллер держит пару ключей (Secret с label sealedsecrets.bitnami.com/sealed-secrets-key=active в своём
# namespace), расшифровывает SealedSecret -> Secret. Публичным ключом шифрует kubeseal на рабочей машине (scripts/seal.sh).
# ВАЖНО: ключ — единственное, что не восстанавливается из git. Бэкап: cluster/sealed-secrets-key.sh (файл вне git),
# восстановление при пересоздании кластера — cluster/bootstrap.sh до старта контроллера.

fullnameOverride: sealed-secrets     # kubeseal по умолчанию ищет sealed-secrets-controller в kube-system -> см. scripts/seal.sh

# Не ротировать ключ автоматически (default 30 дней): при ротации старые SealedSecret в git продолжают
# расшифровываться старым ключом (контроллер хранит все), но бэкап нужно обновлять. Для лабы — фиксированный ключ.
keyrenewperiod: "0"

resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { memory: 128Mi }

metrics:
  serviceMonitor:
    enabled: true
    namespace: sealed-secrets
