# HorizontalPodAutoscaler — меняет replicas Deployment'а по метрике.
# Источник метрик — metrics-server (metrics.k8s.io). Утилизация = использование / requests контейнера,
# поэтому HPA без requests не работает.
#
# Алгоритм: desired = ceil(current * (текущая_утилизация / целевая)).
# Пример: 2 реплики, CPU 150% от requests при цели 50% -> ceil(2 * 3) = 6 -> ограничится maxReplicas.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orders
  namespace: shop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orders
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50     # % от requests.cpu (100m) -> масштабировать при > 50m на под
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0  # реагировать сразу
      policies:
        - type: Percent
          value: 100                 # не больше чем удвоение за период
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60 # по умолчанию 300: ждать, пока нагрузка точно ушла (для лабы короче)
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30          # убирать не быстрее одного пода в 30 с
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inventory
  namespace: shop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inventory
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    # можно несколько метрик — HPA возьмёт максимум из желаемых реплик
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
