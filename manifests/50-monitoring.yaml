# Наблюдаемость приложения через CRD Prometheus Operator (появляются после kube-prometheus-stack).
#
# ServiceMonitor: "найди Service'ы по label и снимай /metrics с их endpoint'ов".
# Operator превращает это в scrape_config Prometheus'а; таргеты — IP подов за Service'ом.
# Аннотации prometheus.io/* на подах для Operator'а НЕ нужны — это старый способ для "ванильного" Prometheus.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shop-services
  namespace: shop
  labels:
    app.kubernetes.io/part-of: shop
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: shop     # Service orders / inventory / notifier
  endpoints:
    - port: http                          # именованный порт Service'а
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames: [shop]
---
# PrometheusRule: алерты и recording rules. Operator собирает их в rule-файлы Prometheus.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shop-alerts
  namespace: shop
  labels:
    app.kubernetes.io/part-of: shop
spec:
  groups:
    - name: shop.rules
      rules:
        # recording rule: заранее посчитанная метрика, чтобы дашборды/алерты не считали rate каждый раз
        - record: shop:orders_created:rate5m
          expr: sum by (outcome) (rate(orders_created_total[5m]))

        - alert: ShopHighOutOfStockRatio
          expr: |
            sum(rate(orders_created_total{outcome="out_of_stock"}[5m]))
              / sum(rate(orders_created_total[5m])) > 0.3
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Более 30% заказов отклоняются из-за нехватки товара"

        - alert: ShopHttp5xx
          expr: |
            sum by (handler) (rate(http_requests_total{namespace="shop", status=~"5.."}[5m])) > 0.1
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "5xx на {{ $labels.handler }}: {{ $value | printf \"%.2f\" }} rps"

        - alert: ShopPodNotReady
          expr: |
            kube_deployment_status_replicas_available{namespace="shop"}
              < kube_deployment_spec_replicas{namespace="shop"}
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Deployment {{ $labels.deployment }}: доступных реплик меньше желаемого"

        - alert: ShopPdbNoDisruptionsAllowed
          expr: kube_poddisruptionbudget_status_pod_disruptions_allowed{namespace="shop"} == 0
          for: 10m
          labels: { severity: info }
          annotations:
            summary: "PDB {{ $labels.poddisruptionbudget }} не допускает эвакуацию — drain ноды застрянет"

        - alert: RabbitMQQueueBacklog
          expr: rabbitmq_queue_messages{namespace="shop"} > 100
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Очередь {{ $labels.queue }}: {{ $value }} сообщений — notifier не успевает"
---
# Дашборд Grafana: ConfigMap с label grafana_dashboard=1, sidecar Grafana подхватит автоматически.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-dashboard
  namespace: shop
  labels:
    grafana_dashboard: "1"
data:
  shop.json: |
    {
      "title": "Shop — overview",
      "uid": "shop-overview",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "Orders / s by outcome",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [{ "expr": "sum by (outcome) (rate(orders_created_total[1m]))", "legendFormat": "{{outcome}}" }]
        },
        {
          "id": 2, "type": "timeseries", "title": "HTTP p95 latency by service",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [{ "expr": "histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket{namespace=\"shop\"}[2m])))", "legendFormat": "{{service}}" }]
        },
        {
          "id": 3, "type": "timeseries", "title": "Requests / s by service and status",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [{ "expr": "sum by (service, status) (rate(http_requests_total{namespace=\"shop\", handler!~\"/metrics|/healthz|/readyz\"}[1m]))", "legendFormat": "{{service}} {{status}}" }]
        },
        {
          "id": 4, "type": "stat", "title": "Cache hit ratio (orders)",
          "gridPos": { "x": 12, "y": 8, "w": 6, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1 } },
          "targets": [{ "expr": "sum(rate(orders_cache_requests_total{result=\"hit\"}[5m])) / sum(rate(orders_cache_requests_total[5m]))" }]
        },
        {
          "id": 5, "type": "stat", "title": "RabbitMQ queue: notifications",
          "gridPos": { "x": 18, "y": 8, "w": 6, "h": 8 },
          "targets": [{ "expr": "sum(rabbitmq_queue_messages{queue=\"notifications\"})" }]
        },
        {
          "id": 6, "type": "timeseries", "title": "Replicas (HPA) and CPU usage",
          "gridPos": { "x": 0, "y": 16, "w": 12, "h": 8 },
          "targets": [
            { "expr": "kube_deployment_status_replicas_available{namespace=\"shop\"}", "legendFormat": "replicas {{deployment}}" },
            { "expr": "sum by (container) (rate(container_cpu_usage_seconds_total{namespace=\"shop\", container=~\"orders|inventory|notifier\"}[2m]))", "legendFormat": "cpu {{container}}" }
          ]
        },
        {
          "id": 7, "type": "timeseries", "title": "Ingress-nginx requests / s by host",
          "gridPos": { "x": 12, "y": 16, "w": 12, "h": 8 },
          "targets": [{ "expr": "sum by (host) (rate(nginx_ingress_controller_requests[1m]))", "legendFormat": "{{host}}" }]
        },
        {
          "id": 8, "type": "timeseries", "title": "Log lines / s by app and level (Loki)",
          "gridPos": { "x": 0, "y": 24, "w": 12, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [{ "datasource": { "type": "loki", "uid": "loki" }, "expr": "sum by (app, level) (rate({namespace=\"shop\", app=~\"orders|inventory|notifier\"} | level != \"\" [1m]))", "legendFormat": "{{app}} {{level}}" }]
        },
        {
          "id": 9, "type": "logs", "title": "WARNING/ERROR logs (Loki) — trace_id кликабелен",
          "gridPos": { "x": 12, "y": 24, "w": 12, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending" },
          "targets": [{ "datasource": { "type": "loki", "uid": "loki" }, "expr": "{namespace=\"shop\", app=~\"orders|inventory|notifier\"} | level=~\"WARNING|ERROR\"" }]
        }
      ]
    }
