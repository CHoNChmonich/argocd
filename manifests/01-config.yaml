# ConfigMap — несекретная конфигурация, Secret — креды.
# Оба подключаются в поды целиком через envFrom (см. deployments).
#
# Хосты — имена Service'ов, которые создают helm-чарты зависимостей (cluster/deps.sh):
#   postgresql        bitnami/postgresql, релиз "postgresql"
#   redis-master      bitnami/redis, релиз "redis" (чарт добавляет суффикс -master)
#   rabbitmq          bitnami/rabbitmq, релиз "rabbitmq"
#   jaeger-collector  jaegertracing/jaeger all-in-one, релиз "jaeger" (OTLP gRPC :4317)
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
  namespace: shop
data:
  LOG_LEVEL: INFO
  INVENTORY_URL: http://inventory:8000
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger-collector:4317
  OTEL_ENABLED: "true"
  CACHE_TTL_SECONDS: "60"
---
apiVersion: v1
kind: Secret
metadata:
  name: shop-secrets
  namespace: shop
type: Opaque
# stringData кодируется в base64 при apply. В реальном проекте секреты в git не кладут:
# external-secrets / sealed-secrets / SOPS. Здесь — учебные значения, совпадающие с infra/values/*.yaml.
stringData:
  DATABASE_URL: postgresql+asyncpg://app:app@postgresql:5432/app
  REDIS_URL: redis://:app@redis-master:6379/0
  RABBITMQ_URL: amqp://app:app@rabbitmq:5672/
