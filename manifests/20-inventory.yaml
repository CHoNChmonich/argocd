# Deployment + ClusterIP Service для inventory.
# Здесь — "эталонный" под: пробы, ресурсы, securityContext, downward API, envFrom.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: shop
  labels:
    app.kubernetes.io/name: inventory
    app.kubernetes.io/part-of: shop
spec:
  # replicas не задаём: числом реплик управляет HPA (manifests/40-hpa.yaml).
  # Если оставить replicas в Deployment, каждый kubectl apply сбрасывал бы его, споря с HPA.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # при обновлении сначала поднимаем новый под, потом гасим старый
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory
        app.kubernetes.io/part-of: shop
      annotations:
        # подсказка для Prometheus (kube-prometheus-stack умеет ServiceMonitor, это — для простого discovery)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      # реплики — по разным нодам; при нехватке нод всё равно планировать (ScheduleAnyway),
      # у ingress-controller стоит DoNotSchedule — там доступность важнее
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor   # не считать control-plane (taint) доменом при расчёте skew
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: inventory
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: inventory
          image: localhost:5001/shop/inventory:dev
          imagePullPolicy: IfNotPresent   # тег :dev перезаписывается — при новом билде нужен rollout restart
          ports:
            - { containerPort: 8000, name: http }
          envFrom:
            - configMapRef: { name: shop-config }
            - secretRef: { name: shop-secrets }
          env:
            - { name: SERVICE_NAME, value: inventory }
            - { name: APP_VERSION, value: "0.1.0" }
            # downward API: под узнаёт о себе из метаданных k8s (видно в GET /info)
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          # startup: даём приложению время подняться, пока не сработает — liveness/readiness не считаются
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          # readiness: пока зависимости недоступны, под исключается из Endpoints, трафик на него не идёт
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          # liveness: процесс завис — контейнер перезапускается. Специально НЕ проверяет зависимости,
          # иначе падение БД вызовет рестарт-шторм всех подов.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }   # по requests планировщик выбирает ноду и считает HPA
            limits: { cpu: 500m, memory: 256Mi }     # limits — потолок; превышение памяти = OOMKill
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }   # readOnlyRootFilesystem: даём писать только в /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: shop
  labels:
    app.kubernetes.io/name: inventory
    app.kubernetes.io/part-of: shop
spec:
  type: ClusterIP   # виден только внутри кластера: http://inventory.shop.svc.cluster.local:8000
  selector:
    app.kubernetes.io/name: inventory
  ports:
    - { name: http, port: 8000, targetPort: http }
