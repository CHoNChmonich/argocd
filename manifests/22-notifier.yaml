# notifier — воркер. Две реплики для отказоустойчивости; масштабировать по длине очереди будем через KEDA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  namespace: shop
  labels:
    app.kubernetes.io/name: notifier
    app.kubernetes.io/part-of: shop
spec:
  replicas: 2   # competing consumers: обе реплики читают одну очередь, RabbitMQ раздаёт сообщения по prefetch
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: notifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifier
        app.kubernetes.io/part-of: shop
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      # реплики — по разным нодам; при нехватке нод всё равно планировать (ScheduleAnyway),
      # у ingress-controller стоит DoNotSchedule — там доступность важнее
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor   # не считать control-plane (taint) доменом при расчёте skew
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: notifier
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: notifier
          image: localhost:5001/shop/notifier:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8000, name: http }
          envFrom:
            - configMapRef: { name: shop-config }
            - secretRef: { name: shop-secrets }
          env:
            - { name: SERVICE_NAME, value: notifier }
            - { name: APP_VERSION, value: "0.1.0" }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 300m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: notifier
  namespace: shop
  labels:
    app.kubernetes.io/name: notifier
    app.kubernetes.io/part-of: shop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: notifier
  ports:
    - { name: http, port: 8000, targetPort: http }
