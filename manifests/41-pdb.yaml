# PodDisruptionBudget — ограничивает ДОБРОВОЛЬНЫЕ прерывания (voluntary disruptions):
# kubectl drain, эвакуация при обновлении нод, cluster-autoscaler, VPA updater.
# На аварии (нода умерла, OOMKill) не влияет — это involuntary.
#
# Механика: drain делает Eviction API-запрос на каждый под; API-сервер проверяет PDB
# и отвечает 429 Too Many Requests, если бюджет исчерпан. drain повторяет, пока поды не переедут.
#
# minAvailable vs maxUnavailable: для Deployment с HPA удобнее maxUnavailable (работает при любом
# числе реплик); minAvailable: 1 при одной реплике блокирует drain навсегда.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orders
  namespace: shop
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inventory
  namespace: shop
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notifier
  namespace: shop
spec:
  minAvailable: 1     # из двух реплик хотя бы одна читает очередь
  selector:
    matchLabels:
      app.kubernetes.io/name: notifier
# PDB для postgresql / redis-master / rabbitmq создают их helm-чарты (pdb.create: true, maxUnavailable: 1);
# PDB ingress-controller — чарт ingress-nginx (controller.minAvailable: 1).
