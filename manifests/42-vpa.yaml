# VerticalPodAutoscaler — подбирает requests/limits контейнера по фактическому потреблению.
# CRD, появляется после установки VPA (cluster/bootstrap.sh -> chart fairwinds/vpa).
#
# updateMode:
#   Off      — только считать рекомендацию (status.recommendation), ничего не менять. Безопасно.
#   Initial  — подставлять рекомендацию при СОЗДАНИИ пода (admission webhook), живые не трогать.
#   Recreate — эвиктить поды, чьи requests далеки от рекомендации, и пересоздавать (учитывает PDB).
#   Auto     — сейчас = Recreate; в будущем in-place resize без рестарта.
#
# ВАЖНО: HPA и VPA по одной метрике (CPU) конфликтуют: HPA добавляет поды, VPA увеличивает requests ->
# утилизация падает -> HPA убирает поды -> ... Поэтому на orders/inventory (HPA по CPU) VPA только Off.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: orders
  namespace: shop
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orders
  updatePolicy:
    updateMode: "Off"
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: inventory
  namespace: shop
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inventory
  updatePolicy:
    updateMode: "Off"
---
# notifier без HPA -> VPA может управлять ресурсами по-настоящему.
# Initial: новые поды (после rollout/эвикции) получают рекомендованные requests.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: notifier
  namespace: shop
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notifier
  updatePolicy:
    updateMode: "Initial"
  resourcePolicy:
    containerPolicies:
      - containerName: notifier
        minAllowed: { cpu: 20m, memory: 64Mi }      # не опускаться ниже
        maxAllowed: { cpu: 500m, memory: 512Mi }    # и не выше
        controlledResources: ["cpu", "memory"]
        controlledValues: RequestsAndLimits          # менять и limits пропорционально
