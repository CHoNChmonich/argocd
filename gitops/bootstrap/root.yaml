# App of apps: применяется руками вместе с project.yaml (cluster/bootstrap.sh) — всё остальное из git.
# Root следит за папкой gitops/ и создаёт все Application'ы из platform/ и apps/;
# дальше каждый из них синхронизирует свой компонент. Добавить компонент = добавить файл и закоммитить.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: bootstrap
  source:
    repoURL: https://github.com/CHoNChmonich/argocd.git
    targetRevision: main
    path: gitops
    directory:
      recurse: true
      exclude: 'bootstrap/*'      # сам root не должен управлять собой
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
