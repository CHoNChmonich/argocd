# SealedSecret'ы из secrets/<namespace>/*.yaml — зашифрованы публичным ключом контроллера (scripts/seal.sh),
# в кластере контроллер превращает их в обычные Secret с теми же именами/ключами, которые ждут чарты (existingSecret).
# Wave 0: CRD SealedSecret уже есть (sealed-secrets, wave -1); потребители — kps (wave 0, grafana), БД (wave 2), Argo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/CHoNChmonich/argocd.git
    targetRevision: main
    path: secrets
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
