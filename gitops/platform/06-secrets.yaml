# ClusterSecretStore (как ходить в Vault) + ExternalSecret из secrets/<namespace>/*.yaml (что принести и под каким
# именем). Значений тут нет — только адреса в Vault; ESO создаёт Secret с именами/ключами, которые ждут чарты
# (existingSecret). Wave 0: CRD ESO уже есть (wave -1); потребители — kps (wave 0, grafana), БД (wave 2), Argo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/CHoNChmonich/argocd.git
    targetRevision: main
    path: secrets
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
