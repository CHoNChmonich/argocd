# Sealed Secrets: секреты в git хранятся зашифрованными (SealedSecret), расшифровать может только контроллер
# в кластере. Wave -1: раньше всего, что потребляет Secret'ы (kps/grafana wave 0, БД wave 2).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://bitnami.github.io/sealed-secrets
      chart: sealed-secrets
      targetRevision: 2.19.3
      helm:
        releaseName: sealed-secrets
        valueFiles:
          - $values/infra/values/sealed-secrets.yaml
    - repoURL: https://github.com/CHoNChmonich/argocd.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
