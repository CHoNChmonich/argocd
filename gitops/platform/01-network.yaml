# Сетевые границы: GlobalNetworkPolicy Calico (default-deny, DNS, apiserver) + NetworkPolicy по namespace'ам,
# метрики Calico и Ingress на Whisker (UI flow-логов). Обычный YAML из cluster/network/.
# Wave -1: после namespaces (-2) и до workload'ов (0+): политики ждут поды, а не наоборот.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://github.com/CHoNChmonich/argocd.git
    targetRevision: main
    path: cluster/network
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 2m }
