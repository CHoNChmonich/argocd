# Приложение: версионированный чарт из локального OCI-registry (helm package + helm push, см. README)
# + values-lab.yaml из git. "Что задеплоено" = версия артефакта в targetRevision.
#
# Вариант для разработки чарта (правка шаблона видна без package/push): вместо первого источника —
#   - repoURL: https://github.com/CHoNChmonich/argocd.git
#     targetRevision: main
#     path: charts/shop
#     helm: { releaseName: shop, valueFiles: [values-lab.yaml] }
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"     # после всех зависимостей
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: oci://kind-registry:5000/charts/shop   # нативный OCI-источник (Secret repo-kind-registry, HTTP)
      targetRevision: 0.1.0                          # тег артефакта = версия чарта
      path: .                                        # содержимое артефакта — сам чарт
      helm:
        releaseName: shop
        valueFiles:
          - $values/charts/shop/values-lab.yaml
    - repoURL: https://github.com/CHoNChmonich/argocd.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: shop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
