apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shop-redis
  namespace: shop
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: redis }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/part-of: shop } } }]
      ports: [{ port: 6379 }]
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } } }]
      ports: [{ port: 9121 }]         # redis-exporter
