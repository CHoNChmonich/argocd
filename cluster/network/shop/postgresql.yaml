apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shop-postgresql
  namespace: shop
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: postgresql }
  policyTypes: [Ingress, Egress]      # egress пустой = БД никуда не ходит (DNS разрешён глобально)
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/part-of: shop } } }]
      ports: [{ port: 5432 }]
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } } }]
      ports: [{ port: 9187 }]         # postgres-exporter
