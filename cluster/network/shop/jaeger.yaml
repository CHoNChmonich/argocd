apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jaeger
  namespace: shop
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: jaeger }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/part-of: shop } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }   # OTel-модуль nginx
      ports: [{ port: 4317 }, { port: 4318 }]   # OTLP gRPC / HTTP
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } } }]
      ports: [{ port: 16686 }]        # UI (jaeger.shop.localtest.me)
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } } }]
      ports: [{ port: 14269 }]        # метрики
