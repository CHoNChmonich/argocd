# Vault: читает ESO, открывают люди через ingress, опрашивает Prometheus. Исходящее — только apiserver
# (TokenReview для Kubernetes auth, разрешён глобально). Никакого интернета: утечь секретам некуда.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault
  namespace: vault
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: external-secrets } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports: [{ port: 8200 }]
    - from: [{ podSelector: {} }]
      ports: [{ port: 8201 }]         # raft между репликами (HA)
