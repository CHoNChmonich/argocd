# DNS нужен всем: без него не резолвится ни один Service. Только к CoreDNS, только 53.
apiVersion: projectcalico.org/v3
kind: GlobalNetworkPolicy
metadata:
  name: allow-dns
spec:
  order: 100
  # Тот же список исключений, что в default-deny. Нюанс Calico: если к поду применена ХОТЬ ОДНА политика на Egress,
  # весь не разрешённый явно egress запрещён. selector: all() без исключений оставил бы kube-system только DNS.
  namespaceSelector: kubernetes.io/metadata.name not in {"kube-system", "calico-system", "calico-apiserver", "tigera-operator", "local-path-storage"}
  selector: all()
  types: [Egress]
  egress:
    - action: Allow
      protocol: UDP
      destination:
        namespaceSelector: kubernetes.io/metadata.name == "kube-system"
        selector: k8s-app == "kube-dns"
        ports: [53]
    - action: Allow
      protocol: TCP
      destination:
        namespaceSelector: kubernetes.io/metadata.name == "kube-system"
        selector: k8s-app == "kube-dns"
        ports: [53]
